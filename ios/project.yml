name: PropertyReplay
options:
  bundleIdPrefix: com.pwegroup
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 2SQV3H5MH9
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
packages:
  SceneRecord:
    path: Packages/SceneRecord
  CaptureCore:
    path: Packages/CaptureCore
  PropertyModel:
    path: Packages/PropertyModel
targets:
  PropertyReplay:
    type: application
    platform: iOS
    sources:
      - path: PropertyReplay
    dependencies:
      - package: SceneRecord
      - package: CaptureCore
      - package: PropertyModel
    info:
      path: PropertyReplay/Info.plist
      properties:
        CFBundleDisplayName: Property Replay
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Property Replay uses the camera to measure how much direct sun reaches the spot where you are standing."
        NSLocationWhenInUseUsageDescription: "Your location sets where the sun is in the sky for this property. It is kept on this device."
        NSMicrophoneUsageDescription: "Hold to dictate a note. Audio is transcribed on this device and not stored."
        NSMotionUsageDescription: "Device motion keeps the sky scan aligned while you turn."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pwegroup.propertyreplay
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
  PropertyReplayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PropertyReplayTests
    dependencies:
      - target: PropertyReplay
      - package: SceneRecord
      - package: CaptureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pwegroup.propertyreplay.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  PropertyReplay:
    build:
      targets:
        PropertyReplay: all
        PropertyReplayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PropertyReplayTests
        - package: CaptureCore/CaptureCoreTests
        - package: PropertyModel/PropertyModelTests
